<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Meine Zufallsbilder</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background: #101319;
    }
    main {
      min-height: 100svh;
      padding: 20px 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    h1 { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    button {
      display: flex;
      justify-content: center;
      align-items: center;
      width: min(100%, 1250px);
      height: min(82svh, 900px);
      min-height: 240px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: #1c222d;
      color: inherit;
      cursor: pointer;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 4px; }
    button:disabled { cursor: progress; }
    #foto { max-width: 100%; max-height: 100%; width: auto; height: auto;
      object-fit: contain; display: block; }
    #foto[hidden], #status[hidden] { display: none; }
    #status { max-width: 30rem; padding: 24px; text-align: center; line-height: 1.6; }
    #hinweis { margin: 0; font-size: 0.875rem; text-align: center; color: #aeb8c6; }
    @media (max-width: 600px) {
      main { padding: 8px 8px 14px; }
      button { height: 82svh; border-radius: 6px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Meine Zufallsbilder</h1>
    <button id="bildKnopf" type="button" aria-label="Ein zufaelliges neues Bild anzeigen">
      <img id="foto" alt="Zufallsbild" hidden>
      <span id="status" role="status" aria-live="polite">Bild wird geladen ...</span>
    </button>
    <p id="hinweis">Klicke oder tippe auf das Bild, um ein neues anzuzeigen.</p>
  </main>
  <script>
    // WICHTIG: Diese Zahl ist die Anzahl deiner Bilder.
    // Bei z. B. 80 Bildern einfach die 120 durch 80 ersetzen.
    const ANZAHL_BILDER = 120;

    // Die Seite erkennt uebliche Namen, die Windows und Mac beim
    // gleichzeitigen Umbenennen vergeben. Alle Bilder liegen in "bilder".
    const NAMENSFORMEN = [
      nummer => `bild (${nummer})`, // Windows: bild (1).jpg
      nummer => `bild${nummer}`,    // Mac:     bild1.jpg
      nummer => `bild ${nummer}`,   // Alternative: bild 1.jpg
      nummer => `Bild (${nummer})`,
      nummer => `Bild${nummer}`,
      nummer => `Bild ${nummer}`
    ];
    const ENDUNGEN = ["jpg", "jpeg", "png", "webp", "gif", "avif", "JPG", "JPEG", "PNG", "WEBP", "GIF", "AVIF"];

    const knopf = document.getElementById("bildKnopf");
    const foto = document.getElementById("foto");
    const status = document.getElementById("status");
    let vorherigeNummer = null;
    let bevorzugteNamensform = 0;
    let bevorzugteEndung = "jpg";
    let laedtGerade = false;

    function reihenfolge(werte, bevorzugt) {
      return [bevorzugt, ...werte.filter(wert => wert !== bevorzugt)];
    }

    function ladeProbe(url) {
      return new Promise(resolve => {
        const probe = new Image();
        probe.onload = () => resolve(true);
        probe.onerror = () => resolve(false);
        probe.src = url;
      });
    }

    function zufallsNummer() {
      if (ANZAHL_BILDER <= 1) return 1;
      if (vorherigeNummer === null) return 1 + Math.floor(Math.random() * ANZAHL_BILDER);
      // Aus allen anderen Bildern gleichmaessig auswaehlen.
      const schritt = 1 + Math.floor(Math.random() * (ANZAHL_BILDER - 1));
      return ((vorherigeNummer - 1 + schritt) % ANZAHL_BILDER) + 1;
    }

    async function naechstesBild() {
      if (laedtGerade) return;
      laedtGerade = true;
      knopf.disabled = true;
      status.textContent = "Bild wird geladen ...";
      status.hidden = !foto.hidden;

      const nummer = zufallsNummer();
      const namenskandidaten = reihenfolge(
        NAMENSFORMEN.map((_, index) => index), bevorzugteNamensform
      );
      const endungskandidaten = reihenfolge(ENDUNGEN, bevorzugteEndung);
      let gefunden = false;

      for (const namensform of namenskandidaten) {
        if (gefunden) break;
        for (const endung of endungskandidaten) {
          const dateiname = NAMENSFORMEN[namensform](nummer) + "." + endung;
          const url = encodeURI("bilder/" + dateiname);
          if (await ladeProbe(url)) {
            foto.src = url;
            foto.alt = "Zufallsbild Nummer " + nummer;
            foto.hidden = false;
            status.hidden = true;
            vorherigeNummer = nummer;
            bevorzugteNamensform = namensform;
            bevorzugteEndung = endung;
            gefunden = true;
            break;
          }
        }
      }

      if (!gefunden) {
        if (foto.hidden) {
          status.textContent = "Kein Bild gefunden. Bitte pruefe, ob die Bilder im Ordner 'bilder' liegen und die Dateinamen mit 'bild' beginnen und nummeriert sind.";
          status.hidden = false;
        } else {
          status.textContent = "Bild Nummer " + nummer + " wurde nicht gefunden. Bitte die Nummerierung im Ordner 'bilder' pruefen.";
          status.hidden = false;
        }
      }
      knopf.disabled = false;
      laedtGerade = false;
    }

    knopf.addEventListener("click", naechstesBild);
    naechstesBild();
  </script>
</body>
</html>
